<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashBD</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#160d29;
      color:white;
    }
    .app{
      max-width:500px;
      margin:auto;
      padding:18px;
    }
    .logo{
      text-align:center;
      font-size:32px;
      font-weight:bold;
      color:#d9b45b;
      margin:15px 0 20px;
    }
    .notice{
      background:#24143d;
      border:1px solid #8d5cff;
      border-radius:14px;
      padding:12px;
      margin-bottom:18px;
      white-space:nowrap;
      overflow:hidden;
    }
    .notice span{
      display:inline-block;
      animation:scroll 12s linear infinite;
    }
    @keyframes scroll{
      from{transform:translateX(100%)}
      to{transform:translateX(-100%)}
    }
    .balance{
      background:linear-gradient(135deg,#5422a8,#b88a28);
      border-radius:20px;
      padding:22px;
      text-align:center;
      margin-bottom:18px;
    }
    .balance small{display:block;font-size:15px}
    .balance strong{font-size:32px}
    .card{
      background:#24143d;
      border-radius:18px;
      padding:18px;
      margin-bottom:14px;
      border:1px solid #43266d;
    }
    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:15px;
      margin-top:10px;
      font-size:16px;
      font-weight:bold;
      color:white;
      background:#6d35d9;
    }
    button:active{transform:scale(.98)}
  </style>
</head>

<body>
<div class="app">

  <div class="notice">
    <span>📢 CashBD Notice: যেকোনো সমস্যা বা সাহায্যের জন্য WhatsApp: 01873570387</span>
  </div>

  <div class="logo">💰 CASHBD</div>

  <div class="balance">
    <small>💰 আপনার ব্যালেন্স</small>
    <strong>৳0.00</strong>
  </div>

  <div class="card">
    <h3>👋 Hello, Sumon Mia</h3>
    <p>User ID: Telegram User</p>
    <p>🔐 Account Status: Inactive</p>
  </div>

  <button onclick="openPage('activation')">🔐 Account Activation</button>
  <button onclick="openPage('earn')">🎯 Earn Tasks</button>
  <button onclick="openPage('withdraw')">💸 Withdraw</button>
  <button onclick="openPage('website')">🌐 ওয়েবসাইটে ভিজিট করে ইনকাম</button>
  <button onclick="openPage('refer')">👥 Refer & Earn</button>
  <button onclick="openPage('video')">🎬 ভিডিও দেখে ইনকাম</button>
  <button onclick="openPage('apps')">📲 App Download & Earn</button>
  <button onclick="openPage('leaderboard')">🏆 Leaderboard</button>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function openPage(page){
  tg.showAlert("CashBD — " + page + " page coming soon");
}
</script>

</body>
</html>
